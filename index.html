<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .card {
            background-color: rgba(0, 0, 0, 0.2);
            width: fit-content;

            padding: 8px 16px;
            border-radius: 8px;
            margin: 16px 0;
        }

    </style>
</head>
<body>

    <p class="bi bi-three-dots-vertical"></p>

    <h1>Meu Site</h1>

    <div id="container">
        <!-- <div class="card">
            <h2>Título do meu card</h2>
            <p>Conteúdo do meu card</p>
        </div> -->
    </div>
    
    <script>

        let items = [
            {
                title: "Homem-Aranha: De Volta ao Lar | Trailer 2 Dublado | 6 de julho nos cinemas",
                content: "Curta a Sony Pictures Brasil no Facebook: http://www.facebook.com/SonyPicturesBrasil Siga a Sony Pictures Brasil no Twitter: ..."
            },
            {
                title: "Homem-Aranha: Longe de Casa | Teaser Trailer Internacional  | DUB | 04 de julho nos cinemas 2 minutos e 20 segundos",
                content: "Curta a Sony Pictures Brasil no Facebook: http://www.facebook.com/SonyPicturesBrasil Siga a Sony Pictures Brasil no Twitter: ..."
            },
            {
                title: "Homem-Aranha: Sem Volta Para Casa | Trailer Oficial Dublado | 16 de dezembro nos cinemas 2 minutos e 54 segundos",
                content: "Em 1 mês começaremos a receber visitas... de todos os universos. Assista agora ao novo trailer oficial de ..."
            },
            {
                title: "Homem-Aranha: Um Novo Dia | Trailer Oficial Dublado",
                content: "Após o fenômeno global de Homem-Aranha: Sem Volta Para Casa, Homem-Aranha: Um Novo Dia marca um capítulo totalmente ..."
            }
        ];

        const container = document.getElementById("container");
        
        // Usando Deconstruction
        for (let {title, content} of items) {
            // Criando Card
            const div = document.createElement("div");
            div.className = "card";
            
            // Criando Título
            const h2 = document.createElement("h2");
            h2.textContent = title;
            div.className = "card";
            div.appendChild(h2); // Adicionando o elemento a um pai
            
            // Criando Parágrafo
            const p = document.createElement("p");
            p.textContent = content;
            div.appendChild(p);              

            container.appendChild(div);
        }

    </script>

</body>
</html>
