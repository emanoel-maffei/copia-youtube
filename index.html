<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube</title>
    <link rel="stylesheet" href="style.css">
    <!-- Biblioteca Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <header class="cabecalho">
        <div class="cabecalho-inicio">
            <span class="fa-solid fa-bars icon"></span>
            
            <div class="logotipo">
                <span class="fa-brands fa-youtube logotipo-icone icon"></span>
                <span class="logotipo-nome">Youtube</span>
                <span class="logotipo-pais">BR</span>
            </div>
        </div>
        
        <div class="cabecalho-centro">
            <div class="search">
                <input type="text" name="search" class="search-input" placeholder="Pesquisar">
                <button type="submit" class="search-button">
                    <span class="fa-solid fa-magnifying-glass search-button-icon icon"></span>
                </button>
                <button class="search-microphone">
                    <span class="fa-solid fa-microphone search-microphone-icon icon"></span>
                </button>
            </div>
        </div>
        
        <div class="cabecalho-final">
            <!-- A fazer... -->
        </div>
    </header>

    <script src="script.js"></script>
</body>
</html>
